name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
      - name: Static analysis
        run: vendor/bin/phpstan analyse --level 8 src
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  spec-freshness:
    name: Spec freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync specs from served contracts
        run: ./tool/sync-spec.sh
      - name: Fail if the vendored specs are stale
        run: git diff --exit-code spec/

  conformance:
    name: Conformance (both contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run conformance suite against Prism mocks
        run: ./tool/conformance.sh
