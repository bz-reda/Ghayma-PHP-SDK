      - $ref: '#/components/parameters/deploymentId'
    post:
      tags: [Deploy]
      operationId: rollbackDeployment
      summary: Redeploy a previous deployment's image.
      description: Re-points the site at the target deployment's built image. The target must have an image.
      responses:
        '200':
          description: A new deployment redeploying the target image.
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  site_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  domains:
                    type: array
                    items:
                      type: string
              examples:
                success:
                  value:
                    id: 1a2b3c4d-5e6f-4071-8293-a4b5c6d7e8f9
                    site_id: f0e1d2c3-b4a5-4967-8879-0a1b2c3d4e5f
                    status: live
                    domains: ['sample-app.ghayma.app']
        '400':
          description: The target deployment has no image to roll back to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: deployment has no image to rollback to
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The rollback cannot proceed: the target is outside the rollback
            window (only the last successful deployments of a site can be
            restored), or a rename of the project is in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rollback_unavailable:
                  value:
                    error: 'This deployment is outside the rollback window: only the last 10 successful deployments of a site can be restored. Deploy again from source instead.'
                rename_in_progress:
                  value:
                    error: a rename is in progress for this project

