  /api/v1/storage/{id}/objects/upload:
    parameters:
      - $ref: '#/components/parameters/bucketId'
    post:
      tags: [Storage]
      operationId: uploadObject
      summary: Upload an object (or create a folder placeholder).
      description: |
        Multipart upload of a single object under `key`. A `key` ending in `/`
        creates a folder placeholder and must not carry a file part; any other
        key requires a `file` part.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                file:
                  type: string
                  format: binary
                  description: The object bytes; omit only for a folder placeholder (key ends with "/").
            example:
              key: images/photo.jpg
              file: (binary file contents)
      responses:
        '200':
          description: The object was uploaded, or the folder placeholder was created.
          content:
            application/json:
              schema:
                type: object
                required: [message, key]
                properties:
                  message:
                    type: string
                  key:
                    type: string
              examples:
                success:
                  value:
                    message: uploaded
                    key: images/photo.jpg
                folder_created:
                  value:
                    message: folder created
                    key: images/
        '400':
          description: Missing or invalid key, missing file, or an ambiguous folder-plus-file request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: key is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: The object exceeds the maximum size or the multipart form is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                payload_too_large:
                  value:
                    error: upload too large (max 100 MB) or malformed multipart form

  /api/v1/storage/{id}/objects/download:
    parameters:
      - $ref: '#/components/parameters/bucketId'
    get:
      tags: [Storage]
      operationId: downloadObject
      summary: Download an object's bytes.
      parameters:
        - name: key
          in: query
          required: true
          description: The object key to download.
          schema:
            type: string
      responses:
        '200':
          description: The object bytes, with content-type and attachment headers.
          headers:
            Content-Type:
              description: The object's stored content type.
              schema:
                type: string
            Content-Length:
              description: The object size in bytes; present when known.
              schema:
                type: integer
            Content-Disposition:
              description: attachment; filename="<last path segment of the key>".
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing key or the object could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: key query param is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/storage/{id}/objects/info:
    parameters:
      - $ref: '#/components/parameters/bucketId'
    get:
      tags: [Storage]
      operationId: getObjectInfo
      summary: Get one object's metadata (HEAD).
      parameters:
        - name: key
          in: query
          required: true
          description: The object key to describe.
          schema:
            type: string
      responses:
        '200':
          description: The object's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectMetadata'
              examples:
                success:
                  value:
                    key: images/photo.jpg
                    size: 20480
                    content_type: image/jpeg
                    etag: '"9a0b1c2d3e4f"'
                    last_modified: '2026-09-10T12:00:00Z'
        '400':
          description: Missing key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: key query param is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/storage/{id}/objects/delete-batch:
    parameters:
      - $ref: '#/components/parameters/bucketId'
    post:
      tags: [Storage]
      operationId: deleteObjectsBatch
      summary: Delete up to 1000 objects by key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
            example:
              keys: ['images/a.jpg', 'images/b.jpg']
      responses:
        '200':
          description: The keys deleted, and per-key errors for any that failed.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, errors]
                properties:
                  deleted:
                    type: array
                    items:
                      type: string
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeleteError'
              examples:
                success:
                  value:
                    deleted: ['images/a.jpg', 'images/b.jpg']
                    errors: []
        '400':
          description: Missing, empty, or over-limit keys array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: keys must be non-empty
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/storage/{id}/objects/delete-prefix:
    parameters:
      - $ref: '#/components/parameters/bucketId'
    post:
      tags: [Storage]
      operationId: deleteObjectsByPrefix
      summary: Delete every object under a prefix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties:
                prefix:
                  type: string
            example:
              prefix: images/
      responses:
        '200':
          description: How many objects were deleted, and per-key errors for any that failed.
          content:
            application/json:
              schema:
                type: object
                required: [deleted_count, errors]
                properties:
                  deleted_count:
                    type: integer
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeleteError'
              examples:
                success:
                  value:
                    deleted_count: 12
                    errors: []
        '400':
          description: Missing or empty prefix (refusing to delete the whole bucket).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: prefix must be non-empty (refusing to delete entire bucket)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    authAppId:
      name: id
      in: path
      required: true
      description: Auth app id (the `id` UUID; the `app_id` slug is accepted by the key binding but the handler resolves by id).
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      description: End-user id within the auth app.
      schema:
        type: string
        format: uuid
    databaseId:
      name: id
      in: path
      required: true
      description: Managed database id.
      schema:
        type: string
        format: uuid
    bucketId:
      name: id
      in: path
      required: true
      description: Storage bucket id.
      schema:
        type: string
        format: uuid
    deploymentId:
      name: id
      in: path
      required: true
      description: Deployment id.
      schema:
        type: string
        format: uuid
    projectPathId:
      name: id
      in: path
      required: true
      description: Project id or slug (the handler resolves either).
      schema:
        type: string
      example: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
    projectId:
      name: projectId
      in: path
      required: true
      description: Project id or slug (the handler resolves either).
      schema:
        type: string
      example: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
    siteId:
      name: siteId
      in: path
      required: true
      description: Site id within the project.
      schema:
        type: string
        format: uuid
  securitySchemes:
    projectKey:
      type: http
      scheme: bearer
      description: 'A project API key `gsk_…`, sent as `Authorization: Bearer gsk_…`.'
  headers:
    RetryAfter:
      description: Seconds until the tripped limit resets.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: |
        No usable project key: the `Authorization` header is missing or
        malformed, or the key is unknown, revoked or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error: invalid key
    Forbidden:
      description: |
        The key is valid but not entitled: the route is not on the project-key
        allowlist, or the key lacks the capability the route requires.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error: project keys cannot access this route
    NotFound:
      description: |
        No such resource for this key. Because a key is scoped to its own
        project, a resource that belongs to another project is reported as
        not found rather than forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                error: not found
    RateLimited:
      description: Too many requests for this key.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              value:
                error: too many requests, please try again later
                code: rate_limited
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable reason, present on newer endpoints.
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    AuthApp:
      type: object
      description: An auth app's configuration, as the management plane renders it. Signing keys and the server key are never included.
      required:
        - id
        - user_id
        - project_id
        - name
        - app_id
        - status
        - allowed_origins
        - email_verification_required
        - google_oauth_enabled
        - google_native_client_ids
        - github_oauth_enabled
        - auth_tier_slug
        - two_fa_enabled
        - sms_enabled
        - two_fa_policy
        - reset_url
        - email_locale
        - jwt_expiry_seconds
        - refresh_expiry_seconds
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: The app owner's platform user id.
        project_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
          description: Present when the app is owned by a team.
        name:
          type: string
        app_id:
          type: string
          description: Public app identifier the `@ghayma/auth` clients are configured with.
        status:
          type: string
          example: active
        allowed_origins:
          type: array
          items:
            type: string
        email_verification_required:
          type: boolean
        google_oauth_enabled:
          type: boolean
        google_client_id:
          type: string
          description: Omitted when empty.
        google_native_client_ids:
          type: array
          description: Native client IDs accepted by the auth service's id-token endpoint.
          items:
            type: string
        github_oauth_enabled:
          type: boolean
        github_client_id:
          type: string
          description: Omitted when empty.
        auth_tier_slug:
          type: string
          description: Capacity bracket from auth_tiers (1k | 10k | 100k | 1m).
        two_fa_enabled:
          type: boolean
        sms_enabled:
          type: boolean
        two_fa_policy:
          type: string
          description: 'disabled | optional | enforced, or "" on apps where a policy was never set.'
        reset_url:
          type: string
          description: Custom reset-page URL; empty string means the hosted reset form is used.
        email_locale:
          type: string
          enum: [en, fr, ar]
        jwt_expiry_seconds:
          type: integer
        refresh_expiry_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthUser:
      type: object
      description: An end user of the auth app, as the management plane renders it. The phone number itself is never selected.
      required:
        - id
        - app_id
        - email
        - name
        - email_verified
        - provider
        - disabled
        - app_metadata
        - phone_verified
        - totp_enabled
        - whatsapp_otp_enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          description: Empty string when the account has no name.
        avatar_url:
          type: string
          description: Omitted when empty.
        email_verified:
          type: boolean
        provider:
          type: string
          enum: [email, google, github]
        disabled:
          type: boolean
        app_metadata:
          type: object
          additionalProperties: true
          description: Developer-owned bag (roles, plan, tenant id), embedded in the end user's access token.
        phone_verified:
          type: boolean
        totp_enabled:
          type: boolean
        whatsapp_otp_enabled:
          type: boolean
          description: Always false — the WhatsApp factor is not offered.
        last_login_at:
          type: string
          format: date-time
          description: Omitted until the first successful sign-in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AuthProviderCount:
      type: object
      required: [provider, count]
      properties:
        provider:
          type: string
        count:
          type: integer
    AuthEvent:
      type: object
      description: One row of an auth app's event log.
      required: [id, app_id, event, ip, user_agent, success, created_at]
      properties:
        id:
          type: string
          format: uuid
        app_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Omitted for events not tied to a user.
        event:
          type: string
          description: Event name, e.g. "login" or "signup".
        ip:
          type: string
        user_agent:
          type: string
        success:
          type: boolean
        details:
          type: string
          description: Omitted when empty.
        created_at:
          type: string
          format: date-time
    AuthStats:
      type: object
      description: Aggregate counters for an auth app plus its 20 most recent events.
      required:
        - total_users
        - verified_users
        - active_sessions
        - signups_today
        - signups_week
        - signups_month
        - events_today
        - events_week
        - logins_today
        - provider_breakdown
        - recent_events
      properties:
        total_users:
          type: integer
        verified_users:
          type: integer
        active_sessions:
          type: integer
        signups_today:
          type: integer
        signups_week:
          type: integer
        signups_month:
          type: integer
        events_today:
          type: integer
        events_week:
          type: integer
        logins_today:
          type: integer
        provider_breakdown:
          type: array
          items:
            $ref: '#/components/schemas/AuthProviderCount'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/AuthEvent'
    Database:
      type: object
      description: A managed database. Resource fields are resolved from the row's tier at render time.
      required:
        - id
        - user_id
        - name
        - type
        - version
        - status
        - host
        - port
        - tier_slug
        - cpu_request
        - cpu_limit
        - memory_request
        - memory_limit
        - cpu_milli
        - memory_mb
        - storage_mb
        - storage_used_bytes
        - disk_gb
        - backup_tier_slug
        - replica_set
        - external_access
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          description: Omitted for a database not attached to a project.
        team_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [postgres, mongodb, redis]
          description: redis is legacy — no new redis databases are provisioned, but pre-existing rows still report it.
        version:
          type: string
        status:
          type: string
          enum: [provisioning, running, stopped, error]
        host:
          type: string
        port:
          type: integer
        db_name:
          type: string
          description: Omitted when empty.
        username:
          type: string
          description: Omitted when empty.
        tier_slug:
          type: string
          description: Sizing bracket from database_tiers — the persisted sizing decision.
        cpu_request:
          type: string
        cpu_limit:
          type: string
        memory_request:
          type: string
        memory_limit:
          type: string
        cpu_milli:
          type: integer
        memory_mb:
          type: integer
        storage_mb:
          type: integer
        storage_used_bytes:
          type: integer
          format: int64
        disk_gb:
          type: integer
          description: Persistent-disk footprint in GB — the points-priced disk blocks.
        backup_tier_slug:
          type: string
          enum: [weekly, daily, sixhourly]
        max_connections:
          type: integer
          description: Omitted when zero.
        replica_set:
          type: boolean
        external_access:
          type: boolean
        external_host:
          type: string
          description: Present only when external access is enabled.
        external_port:
          type: integer
          description: Present only when external access is enabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseCredentials:
      type: object
      description: Connection details for a managed database, read from its Kubernetes secret.
      required: [type, host, port, username, password, database, internal_url, external_access]
      properties:
        type:
          type: string
          enum: [postgres, mongodb, redis]
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        database:
          type: string
        internal_url:
          type: string
          description: In-cluster connection string — always present.
        external_access:
          type: boolean
        external_host:
          type: string
          description: Present only when external access is enabled.
        external_port:
          type: integer
          description: Present only when external access is enabled.
        external_url:
          type: string
          description: Present only when external access is enabled.
    DatabaseMetrics:
      type: object
      description: Live metrics for a running database. Only `status` is set when the database is not running.
      required: [status, size_bytes, size_readable, active_connections]
      properties:
        status:
          type: string
          enum: [provisioning, running, stopped, error]
        uptime_hours:
          type: number
          description: Omitted when zero.
        size_bytes:
          type: integer
          format: int64
        size_readable:
          type: string
          description: Human-readable form of size_bytes, e.g. "12.4 MB".
        active_connections:
          type: integer
        max_connections:
          type: integer
          description: Omitted when zero.
        extra:
          type: object
          additionalProperties: true
          description: |
            Engine-specific counters. postgres: table_count, total_rows,
            cache_hit_ratio, index_usage_ratio, dead_tuples. mongodb: data_size,
            objects, collections, indexes.
    Bucket:
      type: object
      description: A storage bucket in the key's project.
      required:
        - id
        - user_id
        - name
        - garage_bucket
        - storage_used_bytes
        - storage_limit_bytes
        - is_public
        - external_access
        - status
        - allowed_origins
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          description: Omitted for a bucket not attached to a project.
        team_id:
          type: string
          format: uuid
        name:
          type: string
        garage_bucket:
          type: string
          description: Underlying S3 bucket name — pass this as the bucket to an S3 client.
        storage_used_bytes:
          type: integer
          format: int64
        storage_limit_bytes:
          type: integer
          format: int64
        is_public:
          type: boolean
        external_access:
          type: boolean
        status:
          type: string
          enum: [provisioning, active, error]
        allowed_origins:
          type: array
          description: CORS allow-list pushed to the S3 layer.
          items:
            type: string
        project_linked_at:
          type: string
          format: date-time
          description: When the bucket was linked to its project; omitted when never linked.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BucketCredentials:
      type: object
      description: S3 credentials for a bucket — feed straight into any S3 client.
      required: [access_key, secret_key, bucket, endpoint, region]
      properties:
        access_key:
          type: string
        secret_key:
          type: string
        bucket:
          type: string
          description: Underlying S3 bucket name (not the Ghayma bucket id).
        endpoint:
          type: string
        region:
          type: string
    StorageObject:
      type: object
      description: An object or folder listed in a bucket.
      required: [key, size, last_modified, is_folder]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        last_modified:
          type: string
          format: date-time
        etag:
          type: string
          description: Omitted when empty.
        is_folder:
          type: boolean
    ObjectMetadata:
      type: object
      description: Metadata for a single object, from a HEAD.
      required: [key, size, last_modified]
      properties:
        key:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
          description: Omitted when empty.
        etag:
          type: string
          description: Omitted when empty.
        last_modified:
          type: string
          format: date-time
        cache_control:
          type: string
          description: Omitted when empty.
        content_encoding:
          type: string
          description: Omitted when empty.
        content_disposition:
          type: string
          description: Omitted when empty.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: User metadata; omitted when empty.
    DeleteError:
      type: object
      description: One key that could not be deleted, with the reason.
      required: [key, error]
      properties:
        key:
          type: string
        error:
          type: string
    Deployment:
      type: object
      description: |
        A build/deploy of a project site. A live deployment is returned as a
        trimmed shape (id, project_id, site_id, status, image_tag, build_logs,
        domains) plus the queue fields; a queued or building one carries the
        full record plus the queue fields — hence only id, project_id and
        status are always present.
      required: [id, project_id, status]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
          description: Omitted when the deployment predates sites.
        user_id:
          type: string
          format: uuid
        status:
          type: string
          description: e.g. queued, building, live, failed.
        image_tag:
          type: string
          description: Omitted until the build produces an image.
        build_logs:
          type: string
          description: Omitted when empty.
        commit_message:
          type: string
          description: Omitted when empty.
        is_production:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        queue_position:
          type: integer
          description: 1-based rank among queued builds in the same queue; 0 once the build has started.
        queue_size:
          type: integer
          description: How many deployments are currently queued in that queue.
        rollback_available:
          type: boolean
          description: Computed — whether this deployment is still within the rollback window and restorable.
        domains:
          type: array
          description: Live domains, included on a live deployment.
          items:
            type: string
    Project:
      type: object
      description: A project, with the caller's role and the plan-derived resource shape.
      required:
        - id
        - user_id
        - name
        - slug
        - framework
        - suspended
        - billing_mode
        - billing_cycle
        - sleep_enabled
        - custom_dockerfile_enabled
        - created_at
        - updated_at
        - replicas
        - cpu_request
        - cpu_limit
        - memory_request
        - memory_limit
        - role
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
