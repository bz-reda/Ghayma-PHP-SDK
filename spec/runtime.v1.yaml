openapi: 3.0.3
info:
  title: Ghayma Runtime API
  version: 1.0.0
  description: |
    The Ghayma platform API as reached by a **project API key** (`gsk_…`).

    A project key does not reach all of `api.ghayma.tech` — it reaches a
    deny-by-default allowlist (`projectkeys.MatchRoute`), scoped to the key's
    own project and gated by the key's capabilities (`auth`, `deploy`,
    `storage`, `databases`). This document describes exactly that reachable
    surface, one operation per allowlisted route, and nothing else.

    Authenticate with `Authorization: Bearer gsk_…`. A route that is not on
    the allowlist answers `403`; a resource in another project answers `404`
    (the key cannot tell a foreign resource from a missing one). Missing or
    invalid keys answer `401`; a key without the capability a route needs
    answers `403`.
servers:
  - url: https://api.ghayma.tech
tags:
  - name: Auth apps
    description: Administer the end users of an auth app. Requires the `auth` capability.
  - name: Deploy
    description: Upload builds, read deployments, projects and sites. Requires the `deploy` capability.
  - name: Storage
    description: Read buckets and their objects, mint presigned URLs. Requires the `storage` capability.
  - name: Databases
    description: Read managed databases, their credentials and metrics. Requires the `databases` capability.
security:
  - projectKey: []
paths:
  /api/v1/auth-apps:
    get:
      tags: [Auth apps]
      operationId: listAuthApps
      summary: List the auth apps in the key's project.
      responses:
        '200':
          description: The project's auth apps.
          content:
            application/json:
              schema:
                type: object
                required: [auth_apps]
                properties:
                  auth_apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthApp'
              examples:
                success:
                  value:
                    auth_apps:
                      - id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                        user_id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                        project_id: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
                        name: Sample App
                        app_id: sample-app
                        status: active
                        allowed_origins: ['https://sample.example.com']
                        email_verification_required: true
                        google_oauth_enabled: false
                        google_native_client_ids: []
                        github_oauth_enabled: false
                        auth_tier_slug: 1k
                        two_fa_enabled: false
                        sms_enabled: false
                        two_fa_policy: optional
                        reset_url: ''
                        email_locale: en
                        jwt_expiry_seconds: 900
                        refresh_expiry_seconds: 604800
                        created_at: '2026-09-01T10:15:00Z'
                        updated_at: '2026-09-10T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth-apps/{id}:
    parameters:
      - $ref: '#/components/parameters/authAppId'
    get:
      tags: [Auth apps]
      operationId: getAuthApp
      summary: Get one auth app's configuration.
      responses:
        '200':
          description: The auth app.
          content:
            application/json:
              schema:
                type: object
                required: [auth_app]
                properties:
                  auth_app:
                    $ref: '#/components/schemas/AuthApp'
              examples:
                success:
                  value:
                    auth_app:
                      id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                      user_id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                      project_id: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
                      name: Sample App
                      app_id: sample-app
                      status: active
                      allowed_origins: ['https://sample.example.com']
                      email_verification_required: true
                      google_oauth_enabled: false
                      google_native_client_ids: []
                      github_oauth_enabled: false
                      auth_tier_slug: 1k
                      two_fa_enabled: false
                      sms_enabled: false
                      two_fa_policy: optional
                      reset_url: ''
                      email_locale: en
                      jwt_expiry_seconds: 900
                      refresh_expiry_seconds: 604800
                      created_at: '2026-09-01T10:15:00Z'
                      updated_at: '2026-09-10T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/authAppId'
    get:
      tags: [Auth apps]
      operationId: getAuthAppStats
      summary: Get an auth app's aggregate statistics.
      responses:
        '200':
          description: Counters and the 20 most recent events.
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    $ref: '#/components/schemas/AuthStats'
              examples:
                success:
                  value:
                    stats:
                      total_users: 128
                      verified_users: 100
                      active_sessions: 12
                      signups_today: 3
                      signups_week: 20
                      signups_month: 60
                      events_today: 45
                      events_week: 300
                      logins_today: 30
                      provider_breakdown:
                        - provider: email
                          count: 90
                        - provider: google
                          count: 38
                      recent_events:
                        - id: 2b8f6a10-1c2d-4e3f-8a9b-0c1d2e3f4a5b
                          app_id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                          user_id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
                          event: login
                          ip: 203.0.113.10
                          user_agent: Mozilla/5.0
                          success: true
                          created_at: '2026-09-10T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/reset-link:
    parameters:
      - $ref: '#/components/parameters/authAppId'
    post:
      tags: [Auth apps]
      operationId: createPasswordResetLink
      summary: Mint a single-use password-reset link for an end user.
      description: |
        Returns a live, single-use reset link (expires in one hour) for apps
        that send their own reset emails. Send it only to the user's verified
        email; never log it. Requires the admin or owner role on the project
        and is rate-limited per app; minting invalidates any pending reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
            example:
              email: user@example.com
      responses:
        '200':
          description: The reset link and its expiry.
          content:
            application/json:
              schema:
                type: object
                required: [link, expires_at]
                properties:
                  link:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
              examples:
                success:
                  value:
                    link: 'https://sample.example.com/reset?token=example-reset-token'
                    expires_at: '2026-09-12T13:15:00Z'
        '400':
          description: Missing or malformed email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: email required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth-apps/{id}/users:
    parameters:
      - $ref: '#/components/parameters/authAppId'
    get:
      tags: [Auth apps]
      operationId: listAuthAppUsers
      summary: Page through an auth app's end users.
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number (default 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Results per page, 1–100 (default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [users, total, page, per_page]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthUser'
                  total:
                    type: integer
                  page:
                    type: integer
                  per_page:
                    type: integer
              examples:
                success:
                  value:
                    users:
                      - id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
                        app_id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                        email: user@example.com
                        name: Sample User
                        email_verified: true
                        provider: email
                        disabled: false
                        app_metadata:
                          roles: [member]
                        phone_verified: false
                        totp_enabled: false
                        whatsapp_otp_enabled: false
                        last_login_at: '2026-09-09T08:30:00Z'
                        created_at: '2026-09-01T10:15:00Z'
                        updated_at: '2026-09-09T08:30:00Z'
                    total: 128
                    page: 1
                    per_page: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/authAppId'
      - $ref: '#/components/parameters/userId'
    get:
      tags: [Auth apps]
      operationId: getAuthAppUser
      summary: Get one end user of an auth app.
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
              examples:
                success:
                  value:
                    user:
                      id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
                      app_id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                      email: user@example.com
                      name: Sample User
                      email_verified: true
                      provider: email
                      disabled: false
                      app_metadata:
                        roles: [member]
                      phone_verified: false
                      totp_enabled: false
                      whatsapp_otp_enabled: false
                      last_login_at: '2026-09-09T08:30:00Z'
                      created_at: '2026-09-01T10:15:00Z'
                      updated_at: '2026-09-09T08:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Auth apps]
      operationId: deleteAuthAppUser
      summary: Delete an end user from the auth app.
      description: Requires the admin or owner role on the project; audited.
      responses:
        '200':
          description: The user was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                success:
                  value:
                    message: user deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/authAppId'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Auth apps]
      operationId: disableAuthAppUser
      summary: Disable an end user (block sign-in).
      description: Requires the admin or owner role on the project; audited.
      responses:
        '200':
          description: The user was disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                success:
                  value:
                    message: user disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/authAppId'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Auth apps]
      operationId: enableAuthAppUser
      summary: Re-enable a previously disabled end user.
      description: Requires the admin or owner role on the project; audited.
      responses:
        '200':
          description: The user was enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                success:
                  value:
                    message: user enabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/users/{userId}/reset-2fa:
    parameters:
      - $ref: '#/components/parameters/authAppId'
      - $ref: '#/components/parameters/userId'
    post:
      tags: [Auth apps]
      operationId: resetAuthAppUser2FA
      summary: Clear an end user's 2FA enrolment.
      description: |
        Support hammer for a locked-out user (lost authenticator). The user
        signs back in with their password and re-enrols. Requires the admin or
        owner role on the project; audited.
      responses:
        '200':
          description: The user's 2FA enrolment was cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                success:
                  value:
                    message: 2FA reset — the user can sign in with their password and re-enrol
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth-apps/{id}/users/{userId}/app-metadata:
    parameters:
      - $ref: '#/components/parameters/authAppId'
      - $ref: '#/components/parameters/userId'
    patch:
      tags: [Auth apps]
      operationId: updateAuthAppUserAppMetadata
      summary: Replace an end user's developer-owned app_metadata.
      description: |
        Replaces the user's `app_metadata` (roles, plan, tenant id); `{}` clears
        it. The new value reaches the user's access token at the next refresh.
        Requires the admin or owner role on the project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_metadata]
              properties:
                app_metadata:
                  type: object
                  additionalProperties: true
            example:
              app_metadata:
                roles: [admin]
                plan: pro
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
              examples:
                success:
                  value:
                    user:
                      id: 5c6d7e8f-9a0b-4c1d-8e2f-3a4b5c6d7e8f
                      app_id: 7b2f9c14-3e5a-4d61-9f8b-2a1c4e6d8f00
                      email: user@example.com
                      name: Sample User
                      email_verified: true
                      provider: email
                      disabled: false
                      app_metadata:
                        roles: [admin]
                        plan: pro
                      phone_verified: false
                      totp_enabled: false
                      whatsapp_otp_enabled: false
                      last_login_at: '2026-09-09T08:30:00Z'
                      created_at: '2026-09-01T10:15:00Z'
                      updated_at: '2026-09-11T14:00:00Z'
        '400':
          description: The body is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_request:
                  value:
                    error: app_metadata must be a JSON object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases:
    get:
      tags: [Databases]
      operationId: listDatabases
      summary: List the managed databases in the key's project.
      responses:
        '200':
          description: The project's databases.
          content:
            application/json:
              schema:
                type: object
                required: [databases]
                properties:
                  databases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
              examples:
                success:
                  value:
                    databases:
                      - id: d4a1e2b3-6c7d-48e9-b0a1-2c3d4e5f6a7b
                        user_id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                        project_id: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
                        name: primary
                        type: postgres
                        version: '16'
                        status: running
                        host: primary-pg.databases.svc.cluster.local
                        port: 5432
                        db_name: appdb
                        username: appuser
                        tier_slug: db-s
                        cpu_request: 100m
                        cpu_limit: '1'
                        memory_request: 256Mi
                        memory_limit: 1Gi
                        cpu_milli: 1000
                        memory_mb: 1024
                        storage_mb: 5120
                        storage_used_bytes: 734003200
                        disk_gb: 5
                        backup_tier_slug: weekly
                        max_connections: 100
                        replica_set: false
                        external_access: false
                        created_at: '2026-09-01T10:15:00Z'
                        updated_at: '2026-09-10T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/databases/{id}:
    parameters:
      - $ref: '#/components/parameters/databaseId'
    get:
      tags: [Databases]
      operationId: getDatabase
      summary: Get one managed database.
      responses:
        '200':
          description: The database.
          content:
            application/json:
              schema:
                type: object
                required: [database]
                properties:
                  database:
                    $ref: '#/components/schemas/Database'
              examples:
                success:
                  value:
                    database:
                      id: d4a1e2b3-6c7d-48e9-b0a1-2c3d4e5f6a7b
                      user_id: 3f7c2b90-5e1a-4f2b-9c3d-8a1b2c3d4e5f
                      project_id: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
                      name: primary
                      type: postgres
                      version: '16'
                      status: running
                      host: primary-pg.databases.svc.cluster.local
                      port: 5432
                      db_name: appdb
                      username: appuser
                      tier_slug: db-s
                      cpu_request: 100m
                      cpu_limit: '1'
                      memory_request: 256Mi
                      memory_limit: 1Gi
                      cpu_milli: 1000
                      memory_mb: 1024
                      storage_mb: 5120
                      storage_used_bytes: 734003200
                      disk_gb: 5
                      backup_tier_slug: weekly
                      max_connections: 100
                      replica_set: false
                      external_access: false
                      created_at: '2026-09-01T10:15:00Z'
                      updated_at: '2026-09-10T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{id}/credentials:
    parameters:
      - $ref: '#/components/parameters/databaseId'
    get:
      tags: [Databases]
      operationId: getDatabaseCredentials
      summary: Get a managed database's connection credentials.
      responses:
        '200':
          description: Connection details, including the live password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseCredentials'
              examples:
                success:
                  value:
                    type: postgres
                    host: primary-pg.databases.svc.cluster.local
                    port: 5432
                    username: appuser
                    password: example-password
                    database: appdb
                    internal_url: 'postgresql://appuser:example-password@primary-pg.databases.svc.cluster.local:5432/appdb'
                    external_access: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/databases/{id}/metrics:
    parameters:
      - $ref: '#/components/parameters/databaseId'
    get:
      tags: [Databases]
      operationId: getDatabaseMetrics
      summary: Get a managed database's live metrics.
      description: When the database is not running, only `status` is set.
      responses:
        '200':
          description: Live metrics.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics:
                    $ref: '#/components/schemas/DatabaseMetrics'
              examples:
                success:
                  value:
                    metrics:
                      status: running
                      uptime_hours: 128.5
                      size_bytes: 734003200
                      size_readable: 700 MB
                      active_connections: 4
                      max_connections: 100
                      extra:
                        table_count: 12
                        total_rows: 34567
                        cache_hit_ratio: 0.98
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/deploy/upload:
    post:
      tags: [Deploy]
      operationId: uploadDeploy
      summary: Upload a source archive and queue a build.
      description: |
        Multipart upload of a project's source as a `.zip` or `.tar.gz`. Creates
        a deployment record and queues the build; the response returns before the
        build runs. `project_id` must be the key's own project. `site_id` is
        optional — empty deploys to the project's default site.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, source]
              properties:
                project_id:
                  type: string
                  description: Target project id (must be the key's project).
                source:
                  type: string
                  format: binary
                  description: Source archive, `.zip` or `.tar.gz`.
                site_id:
                  type: string
                  description: Target site id; empty deploys to the default site.
                commit_message:
                  type: string
                is_production:
                  type: string
                  description: '"true" marks a production deploy; any other value is non-production.'
                root_directory:
                  type: string
                dockerfile_path:
                  type: string
                  description: Honoured only when the project enables a custom Dockerfile.
                port:
                  type: integer
                framework:
                  type: string
                build_command:
                  type: string
                install_command:
                  type: string
                start_command:
                  type: string
                output_directory:
                  type: string
                builder:
                  type: string
                crons:
                  type: string
                  description: The ghayma.json `crons` array, forwarded verbatim as a JSON string.
            example:
              project_id: a1b2c3d4-e5f6-4708-9a0b-1c2d3e4f5061
              source: (binary .zip or .tar.gz archive)
              commit_message: deploy from CI
              is_production: 'true'
      responses:
        '201':
          description: Source uploaded and the build was queued.
          content:
            application/json:
              schema:
                type: object
                required: [deployment_id, status, message]
                properties:
                  deployment_id:
                    type: string
                    format: uuid
                  site_id:
                    type: string
                    format: uuid
                    description: The site the deployment was created for.
                  status:
                    type: string
                  message:
                    type: string
              examples:
                success:
                  value:
